name: Manager CI

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'manager/**'
      - 'server/**'
      - 'api/**'
      - '*.gradle'
      # 改这个 workflow 本身也要能触发，否则调整流水线时得靠一次无关推送才生效。
      - '.github/workflows/manager-ci.yml'
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

# 连续推送时取消上一次还在跑的构建，避免多个构建同时占用时间。
concurrency:
  group: manager-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Manager Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: 设置 JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        # 已覆盖 ~/.gradle/caches，无需再单独缓存一次。
        cache: gradle

    - name: 授予 gradlew 执行权限
      run: chmod +x gradlew

    - name: 设置 Android SDK
      uses: android-actions/setup-android@v4
      with:
        # setup-android@v3 默认安装 'tools' 包，该包已被 Google 从 SDK 仓库
        # 下架，导致 sdkmanager 以 "Failed to find package 'tools'" 退出 1。
        # v4 已把 'tools' 从默认包列表移除，这里再显式限定一次以免回归。
        packages: 'platform-tools'

    - name: 接受 Android SDK 许可
      run: yes | sdkmanager --licenses || true

    - name: 安装 Android SDK 组件
      run: |
        sdkmanager "build-tools;36.0.0"
        sdkmanager "platforms;android-36"
        sdkmanager "platforms;android-37.0"
        sdkmanager "ndk;29.0.13113456"

    # 只构建 release：debug 变体未开启 R8，体积大且与 release 重复编译一遍，
    # 是整条流水线里最耗时的一步。需要可调试包时本地或临时改回 assembleDebug。
    - name: 构建 Release APK
      run: ./gradlew :manager:assembleRelease --stacktrace --no-daemon

    - name: 上传 Release APK
      uses: actions/upload-artifact@v4
      with:
        name: manager-release-apk
        path: manager/build/outputs/apk/release/*.apk
        retention-days: 7

    - name: 构建摘要
      if: always()
      run: |
        echo "## Manager 构建摘要" >> $GITHUB_STEP_SUMMARY
        echo "- 变体：release（R8 混淆 + 资源收缩）" >> $GITHUB_STEP_SUMMARY
        echo "- 产物：manager-release-apk，保留 7 天" >> $GITHUB_STEP_SUMMARY
